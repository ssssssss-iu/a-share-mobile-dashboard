<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f8">
  <meta name="description" content="A股主板双通道条件化研究看板">
  <title>A股盘面检查单</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="masthead">
    <div class="brand-block">
      <span class="brand-mark" aria-hidden="true">沪深</span>
      <div>
        <p class="eyebrow">A股双通道研究</p>
        <h1>盘面检查单</h1>
      </div>
    </div>
    <div class="asof" id="asof">正在读取数据…</div>
  </header>

  <main id="main" aria-live="polite">
    <section id="status-panel" class="status-panel skeleton" aria-label="市场状态"></section>
    <section id="checkpoint-panel" class="checkpoint-panel" aria-label="盘面节点"></section>
    <section id="indices-panel" class="indices-panel" aria-label="主要指数"></section>
    <section id="sectors-panel" class="sectors-panel" aria-label="强势板块"></section>

    <section class="analysis-section" aria-labelledby="analysis-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">由公开行情和评分规则自动生成</p>
          <h2 id="analysis-title">盘面分析</h2>
        </div>
        <span class="analysis-mode" id="analysis-mode">规则模板</span>
      </div>
      <div id="analysis-panel" class="analysis-panel"></div>
    </section>

    <section id="ai-section" class="analysis-section ai-section" aria-labelledby="ai-title" hidden>
      <div class="section-heading">
        <div>
          <p class="eyebrow">只解释现有行情与规则结果</p>
          <h2 id="ai-title">AI盘面解读</h2>
        </div>
        <span class="analysis-mode" id="ai-mode">OpenAI</span>
      </div>
      <div id="ai-panel" class="ai-panel"></div>
    </section>

    <section class="candidate-section" aria-labelledby="candidate-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">每次更新展示评分前五，候选线仍为60分</p>
          <h2 id="candidate-title">评分榜 Top 5</h2>
        </div>
        <span class="count" id="candidate-count">—</span>
      </div>
      <div class="filter-bar" id="filter-bar" role="group" aria-label="评分榜通道">
        <button type="button" class="filter active" data-filter="all">全部</button>
        <button type="button" class="filter" data-filter="ordinary">普通隔夜</button>
        <button type="button" class="filter" data-filter="hot">热点波段</button>
      </div>
      <div id="candidate-list" class="candidate-list"></div>
    </section>

    <section id="method-panel" class="method-panel" aria-label="方法与数据"></section>
  </main>

  <footer>
    <p>评分榜用于比较，不等于推荐；严格候选可以为 0。页面不连接券商。</p>
  </footer>
  <script src="assets/app.js" defer></script>
</body>
</html>

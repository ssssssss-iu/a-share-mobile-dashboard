name: 更新并发布A股研究看板

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "config/scoring_candidate.json"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/publish.yml"
  schedule:
    # GitHub cron is UTC. Shanghai is UTC+8 year-round.
    - cron: "25 1 * * 1-5"  # 09:25
    - cron: "30 1 * * 1-5"  # 09:30 backup
    - cron: "30 2 * * 1-5"  # 10:30
    - cron: "35 2 * * 1-5"  # 10:35 backup
    - cron: "5 5 * * 1-5"   # 13:05
    - cron: "10 5 * * 1-5"  # 13:10 backup
    - cron: "30 6 * * 1-5"  # 14:30
    - cron: "35 6 * * 1-5"  # 14:35 backup
    - cron: "5 7 * * 1-5"   # 15:05
    - cron: "10 7 * * 1-5"  # 15:10 backup
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: a-share-mobile-dashboard
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependency
        run: python -m pip install -r requirements.txt

      - name: Run rule tests
        run: python -m unittest discover -s tests -v

      - name: Build current snapshot
        run: python scripts/build_dashboard.py

      - name: Generate optional AI analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/enrich_ai.py

      - name: Save public snapshot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/latest.json site/history
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "data: update market snapshot"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark failed market fetch after publishing status
        run: python scripts/check_status.py

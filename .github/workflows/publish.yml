name: 更新并发布A股研究看板

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "config/scoring_candidate.json"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/publish.yml"
  schedule:
    # GitHub backup cron is UTC and runs five minutes after each Beijing-time primary slot.
    - cron: "30,45 1 * * 1-5"
    - cron: "0,15,30,45 2 * * 1-5"
    - cron: "0,15,30 3 * * 1-5"
    - cron: "10,25,40,55 5-6 * * 1-5"
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      scheduler:
        description: "Trigger source"
        required: false
        default: "manual"
      scheduled_time:
        description: "External scheduler timestamp"
        required: false
        default: ""
      publish_only:
        description: "Publish the checked-in site without fetching market data"
        required: false
        default: "false"
      ai_only:
        description: "Reuse the checked-in market snapshot and refresh only AI analysis"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: a-share-mobile-dashboard
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Check scheduled backup freshness
        id: freshness
        if: github.event_name == 'schedule'
        run: python scripts/should_refresh.py --max-age-minutes 10 --max-lateness-minutes 8

      - name: Install dependency
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_only != 'true') && steps.freshness.outputs.should_refresh != 'false'
        run: python -m pip install -r requirements.txt

      - name: Run rule tests
        if: github.event_name == 'push' && steps.freshness.outputs.should_refresh != 'false'
        run: python -m unittest discover -s tests -v

      - name: Check optional TdxAiData source
        if: (github.event_name != 'workflow_dispatch' || (inputs.publish_only != 'true' && inputs.ai_only != 'true')) && steps.freshness.outputs.should_refresh != 'false'
        env:
          TDX_AI_DATA_TOKEN: ${{ secrets.TDX_AI_DATA_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python scripts/check_tdxaidata.py --full
          else
            python scripts/check_tdxaidata.py
          fi

      - name: Build current snapshot
        if: (github.event_name != 'workflow_dispatch' || (inputs.publish_only != 'true' && inputs.ai_only != 'true')) && steps.freshness.outputs.should_refresh != 'false'
        env:
          DASHBOARD_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduler || github.event_name }}
          DASHBOARD_SCHEDULED_TIME: ${{ inputs.scheduled_time || '' }}
          TDX_AI_DATA_TOKEN: ${{ secrets.TDX_AI_DATA_TOKEN }}
        run: python scripts/build_dashboard.py

      - name: Generate optional AI analysis
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_only != 'true') && steps.freshness.outputs.should_refresh != 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/enrich_ai.py

      - name: Save public snapshot history
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_only != 'true') && steps.freshness.outputs.should_refresh != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/latest.json site/history site/intraday site/research
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "data: update market snapshot"
            git push
          fi

      - name: Configure Pages
        if: steps.freshness.outputs.should_refresh != 'false'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.freshness.outputs.should_refresh != 'false'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        if: steps.freshness.outputs.should_refresh != 'false'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark failed market fetch after publishing status
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_only != 'true') && steps.freshness.outputs.should_refresh != 'false'
        run: python scripts/check_status.py
